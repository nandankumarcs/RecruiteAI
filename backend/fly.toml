# fly.toml - RecruiteAI backend
app = "recruiteai-backend"
primary_region = "bom"

[build]

[env]
  PYTHON_VERSION = "3.13.0"
  TELEPHONY_PROVIDER = "mock"
  VOICE_RUNTIME = "deepgram_openai"
  TTS_PROVIDER = "sarvam"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
