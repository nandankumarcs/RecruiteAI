# Docker Compose for RecruiteAI development services
# Usage: docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: recruiteai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruiteai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: recruiteai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker-nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Note: backend and frontend services should be defined here
  # Uncomment and configure when ready to use full Docker setup
  # backend:
  #   build: ./backend
  #   container_name: recruiteai-backend
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruiteai
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped
  #
  # frontend:
  #   build: ./frontend
  #   container_name: recruiteai-frontend
  #   ports:
  #     - "5173:5173"
  #   restart: unless-stopped

volumes:
  pgdata:
  nginx-logs:
